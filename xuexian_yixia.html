<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雪线以下 · 互动漫画</title>
<style>
:root{color-scheme:dark;--ink:#151514;--paper:#ece9df;--muted:#bcb8aa}
*{box-sizing:border-box}body{margin:0;background:#111;color:var(--paper);font-family:"Songti SC",SimSun,serif}
button{font:inherit;color:inherit;background:#20201e;border:1px solid #767366;padding:.55em .85em;cursor:pointer}button:focus-visible{outline:3px solid white;outline-offset:3px}
header,footer{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 16px;background:#151514;z-index:3}
header{position:sticky;top:0;border-bottom:1px solid #56534d}header strong{letter-spacing:.24em}header small{color:var(--muted)}
footer{position:sticky;bottom:0;border-top:1px solid #56534d;justify-content:center}footer button:disabled{opacity:.4;cursor:default}
#stage{max-width:780px;margin:auto;padding:22px 18px 28px;min-height:75vh}
h1{font-size:24px;letter-spacing:.18em;margin:0 0 14px}h1 small{font-size:13px;color:var(--muted);margin-right:1em}
#panels{background:var(--paper);padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
figure{margin:0;position:relative;overflow:hidden;background:var(--ink)}figure.wide{grid-column:1/-1}figure svg{width:100%;height:auto;display:block;aspect-ratio:1.85}figure.wide svg{aspect-ratio:2.48}figure.tall svg{aspect-ratio:2.1}
figcaption{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 16px);color:#171716;background:#ece9df;padding:4px 8px;border:1px solid #171716;font-size:clamp(12px,1.8vw,16px);line-height:1.4}
.inspect{position:absolute;top:7px;right:7px;background:#111e;font-size:13px}
#cut{position:fixed;inset:0;pointer-events:none;display:grid;place-items:center;z-index:2;visibility:hidden;background:#151514ed}
#cut.play{visibility:visible;animation:cut .85s both}#cut svg{width:min(78vw,540px);height:165px}#cut svg path{stroke-dasharray:1;stroke-dashoffset:0;animation:draw .55s both}
@keyframes cut{0%,100%{opacity:0}30%,62%{opacity:1}}@keyframes draw{from{stroke-dashoffset:1}}
dialog{background:#191918;color:var(--paper);border:1px solid #aaa598;width:min(94vw,760px);max-height:92vh;padding:14px}dialog::backdrop{background:#000c}
.dialog-bar{display:flex;justify-content:space-between;align-items:center;gap:8px}#detailArt svg{width:100%;max-height:57vh;display:block}#detailText,#feedback{line-height:1.6}#feedback{min-height:1.6em;margin-bottom:0;color:var(--muted)}
.motion .shake{animation:shake .55s ease-in-out}.motion .sweep{animation:sweep 1.1s both}.motion .reach{animation:reach .72s both}.motion .pulse{animation:pulse .9s both}
#detailArt svg g{transition:translate .5s ease,rotate .5s ease}
#detailArt[data-action="pry"] .prop-lock{translate:13px -28px;rotate:8deg;transform-origin:center}
#detailArt[data-action="lift"] .prop-hatch{translate:-16px -26px}
#detailArt[data-action="lift"] .prop-fist{translate:8px -33px}
#detailArt[data-action="rope"] .prop-bundle .shake{translate:24px 13px;transition:translate .45s ease}
#detailArt[data-action="bell"] .prop-ring{translate:0 24px}
@keyframes shake{25%,65%{transform:translateX(-10px)}45%,85%{transform:translateX(10px)}}
@keyframes sweep{from{transform:translateX(-150px);opacity:.15}to{transform:none}}
@keyframes reach{from{transform:translateY(56px);opacity:.25}to{transform:none}}
@keyframes pulse{0%,100%{opacity:1}35%,65%{opacity:.25}}
@media(max-width:550px){#stage{padding:12px 8px}header small{display:none}figure:not(.wide) svg{aspect-ratio:1.35}}
@media(prefers-reduced-motion:reduce){#cut.play{visibility:hidden;animation:none}.motion :is(.shake,.sweep,.reach,.pulse){animation:none}}
</style>
</head>
<body>
<header><strong>雪线以下</strong><small>现实悬疑 · 十页互动漫画</small><button id="sound" type="button" aria-pressed="false">声音 关</button></header>
<main id="stage"><h1 id="heading" tabindex="-1"></h1><div id="panels"></div></main>
<footer><button id="prev" type="button">← 上一页</button><span id="progress" role="status"></span><button id="next" type="button">下一页 →</button></footer>
<div id="cut" aria-hidden="true"></div>
<dialog id="detail" aria-labelledby="detailTitle">
  <div class="dialog-bar"><h2 id="detailTitle"></h2><form method="dialog"><button autofocus>关闭</button></form></div>
  <div id="detailArt"></div><p id="detailText"></p><button id="action" type="button" hidden></button><p id="feedback" role="status"></p>
</dialog>

 ['留在雪上',[

const shapes={
 tower:'<path d="M55 240L104 20H143L207 240M85 104H166M73 155H183M63 203H198M102 24L170 155L69 202L148 24M20 25H223" fill="none" stroke="currentColor" stroke-width="10"/>',
 yan:'<circle cx="41" cy="29" r="21" fill="#bbb8ad"/><path d="M17 28Q16 0 45 6L66 27M18 128L24 57L59 49L81 119L60 133L71 178H50L40 136L27 179H5Z" fill="currentColor"/><path d="M22 61L10 101L41 116M59 61L83 99M31 75L61 65" fill="none" stroke="#77766e" stroke-width="7"/>',
 he:'<circle cx="40" cy="28" r="21" fill="#d8d5ca"/><path d="M21 46L10 23L25 3H55L65 26L56 49M15 128L20 57L59 50L78 123L62 136L78 171H55L41 139L22 175H4Z" fill="currentColor"/><path d="M58 61L46 86L27 75" fill="none" stroke="#ede9df" stroke-width="15"/><path d="M24 63L4 88L-10 78" fill="none" stroke="#8f8b80" stroke-width="9"/>',
 zhou:'<path d="M4 29H74L61 16H22Z" fill="currentColor"/><circle cx="40" cy="40" r="19" fill="#aaa79d"/><path d="M4 122L14 64H65L79 122L65 135L76 173H53L42 139L30 173H7Z" fill="currentColor"/><path d="M56 74L81 106L98 113" fill="none" stroke="#918e84" stroke-width="9"/>',
 worker:'<circle cx="42" cy="28" r="20" fill="#b9b6ab"/><path d="M14 122L20 57H64L78 122L65 135L73 172H53L41 137L29 172H9Z" fill="currentColor"/><path d="M21 79H65" stroke="#bbb9af" stroke-width="8"/><circle cx="54" cy="22" r="9" fill="#fff"/>',
 shovel:'<path d="M9 7L148 84M4 15L15 0M144 73L174 83L161 110L139 94Z" fill="currentColor" stroke="currentColor" stroke-width="5"/>',
 bundle:'<path d="M12 37Q13 12 58 10L145 28Q174 41 156 70L87 87L17 69Z" fill="#6f6c63" stroke="#171716" stroke-width="5"/><path class="shake" d="M47 16L61 77M50 16L65 77M105 22L113 78M62 45Q121 12 112 56L83 67" fill="none" stroke="#171716" stroke-width="5" stroke-dasharray="7 2"/>',
 phone:'<rect x="4" y="5" width="53" height="92" rx="7" fill="#171716" stroke="#dad7cd" stroke-width="5"/><path d="M15 23H46M16 69H44" stroke="#d8d5ca" stroke-width="5"/>',
 ring:'<path class="shake" d="M31 0V82M31 80a21 26 0 1 0 1 0Z" fill="none" stroke="#9d9a8e" stroke-width="8"/>',

 hatch:'<path d="M4 55L52 3H196L166 65Z" fill="#575650" stroke="#252522" stroke-width="4"/><path d="M22 51L60 14H177L154 54Z M94 27H126" fill="none" stroke="#a09c91" stroke-width="4"/>',

 scar:'<path d="M3 4Q12 19 29 12" fill="none" stroke="#26241e" stroke-width="4"/>',
 bowl:'<path d="M10 25Q46 5 73 16L79 29L93 15Q127 19 141 29Q120 83 73 83Q35 83 10 25Z" fill="#e3ded1" stroke="#464238" stroke-width="5"/><path d="M23 36Q76 59 129 36" fill="none" stroke="#625e52" stroke-width="4"/>',
 steam:'<path class="pulse" d="M5 91Q44 56 16 36Q7 16 38 0M35 97Q63 65 40 54Q27 45 51 21" fill="none" stroke="#a8a499" stroke-width="5"/>',

 lock:'<path class="shake" d="M16 43V26a19 20 0 0 1 38 0v18M8 42H63V90H8Z" fill="#66645b" stroke="#d6d2c6" stroke-width="5"/><circle cx="35" cy="65" r="5" fill="#171716"/>',
 bell:'<path class="shake" d="M8 67Q22 52 24 31Q25 8 44 8Q66 9 70 31Q73 54 86 67Z M44 68V82" fill="#77746a" stroke="#252522" stroke-width="6"/><path class="pulse" d="M1 15L-15 2M83 16L99 0" stroke="#252522" stroke-width="5"/>',
 hut:'<path d="M0 42L57 0L123 42V92H0Z" fill="#33332f"/><path class="pulse" d="M46 48H77V71H46Z" fill="#fff"/>',
 beam:'<path class="sweep" d="M0 12L204-38L204 75Z" fill="#fff" opacity=".48"/>',
 track:'<path d="M0 30Q128 60 291 0" fill="none" stroke="#77746b" stroke-width="3"/><path d="M23 39l14-6m25 10l14-6m27 7l14-6m27 2l14-6m28 2l14-6m26-1l14-6" stroke="#625f56" stroke-width="6" stroke-linecap="round"/>'
};
const cutLines={
 ring:'M310 6V82a31 36 0 1 0 1 0Z',
 beam:'M30 85L565 25L565 145Z',
 steam:'M250 142Q341 100 280 72Q235 48 325 10M324 143Q398 110 345 70',
 lock:'M243 76V50a57 39 0 0 1 114 0v26M226 75H374V145H226Z',
 track:'M11 141Q257 152 589 25M117 129l28-12m66 7l26-12m66-6l25-12m60-4l24-12',
 bell:'M222 133Q249 100 253 57Q257 20 301 20Q343 20 349 57Q352 98 379 133Z M301 134v24'
};
const $=id=>document.getElementById(id);
let page=0, selected=null, context=null, muted=true;
function picture(frame){
  const [ground,objects]=frame;
  const light=ground!=='dark';
  const snow=ground==='snow';
  const strokes=Array.from({length:44},(_,i)=>{
    const x=(i*73)%620, y=(i*43)%250;
    return snow?`M${x} ${y}l-9 4`:`M${x} ${y}l-17 8`;
  }).join(' ');
  return `<svg viewBox="0 0 620 250" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <rect width="620" height="250" fill="${light?'#e8e5db':'#191918'}"/>
    ${snow?'<path d="M0 125L105 81L172 110L268 56L340 106L461 48L620 94V143Q390 118 0 198Z" fill="#9c9a90"/><path d="M0 127L107 85L170 113L268 60L338 111L459 52L620 97" stroke="#272724" stroke-width="5" fill="none"/>':''}
    <path d="${strokes}" stroke="${light?'#4f4d46':'#b0ada1'}" opacity=".55" stroke-width="${snow?2:3}"/>
    ${objects.split(';').map(obj=>{
      const [name,x,y,scale]=obj.split(' ');
      return `<g class="prop-${name}" transform="translate(${x} ${y}) scale(${scale})" color="${light?'#252522':'#77746b'}">${shapes[name]}</g>`;
    }).join('')}
  </svg>`;
}
function playSound(notes){
  if(muted||!window.AudioContext)return;
  context??=new AudioContext();
  if(context.state==='suspended')context.resume().catch(()=>{});
  const start=context.currentTime;
  notes.forEach(([offset,pitch,length])=>{
    const osc=context.createOscillator(), gain=context.createGain(), t=start+offset;
    osc.type='triangle';osc.frequency.value=pitch;
    gain.gain.setValueAtTime(.08,t);gain.gain.exponentialRampToValueAtTime(.001,t+length);
    osc.connect(gain).connect(context.destination);osc.start(t);osc.stop(t+length);
  });
}
function render(focus=false){
  const [title,frames]=chapters[page];
  $('heading').innerHTML=`<small>${String(page+1).padStart(2,'0')}</small>${title}`;
  $('progress').textContent=`${page+1} / ${chapters.length}`;
  $('prev').disabled=page===0;
  $('next').disabled=page===chapters.length-1;
  $('next').textContent=page===1?'掀开油布 →':page===7?'警铃之后 →':'下一页 →';
  $('panels').replaceChildren(...frames.map(frame=>{
    const [, ,caption,style,label]=frame, panel=document.createElement('figure');
    panel.className=`motion ${style||''}`;
    panel.innerHTML=picture(frame);
    if(caption){
      const text=document.createElement('figcaption');text.textContent=caption;panel.append(text);
    }
    if(label){
      const button=document.createElement('button');
      button.className='inspect';button.type='button';button.textContent=frame[6]?'＋ 交互':'＋ 特写';
      button.setAttribute('aria-label',`${label}，${frame[6]?'交互':'查看特写'}`);
      button.addEventListener('click',()=>inspect(frame));panel.append(button);
    }
    return panel;
  }));
  if(focus){window.scrollTo(0,0);$('heading').focus({preventScroll:true});}
}
function flip(step){
  const next=page+step;
  if(next<0||next>=chapters.length)return;
  const motif=chapters[Math.min(next,page)][2], cut=$('cut');
  cut.classList.remove('play');
  cut.innerHTML=`<svg viewBox="0 0 620 170"><path pathLength="1" d="${cutLines[motif]}" fill="none" stroke="#ece9df" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
  void cut.offsetWidth;
  cut.classList.add('play');
  page=next;render(true);
}
function inspect(frame){
  selected=frame;
  const [,,,,title,description,action]=frame;
  $('detailTitle').textContent=title;
  $('detailArt').classList.remove('motion');
  delete $('detailArt').dataset.action;
  $('detailArt').innerHTML=picture(frame);
  $('detailText').textContent=description;
  $('action').textContent=action||'';
  $('action').hidden=!action;
  $('feedback').textContent='';
  $('detail').showModal();
}
const effects={
  knock:[[0,138,.13],[.42,118,.15]],
  pry:[[0,92,.25]],lift:[[0,125,.22]],rope:[[0,160,.12]],
  bell:[[0,530,1.35],[0,790,.95],[.33,530,.9]]
};
$('action').addEventListener('click',()=>{
  const art=$('detailArt');
  if(selected[8]==='bell'){
    const aftermath=chapters[page][1].find(frame=>frame[1].includes('bell '));
    art.innerHTML=picture(aftermath);
  }
  art.dataset.action=selected[8];
  art.classList.remove('motion');void art.offsetWidth;art.classList.add('motion');
  $('feedback').textContent=selected[7];
  playSound(effects[selected[8]]);
});
$('prev').addEventListener('click',()=>flip(-1));
$('next').addEventListener('click',()=>flip(1));
$('sound').addEventListener('click',()=>{
  muted=!muted;$('sound').setAttribute('aria-pressed',!muted);
  $('sound').textContent=muted?'声音 关':'声音 开';
  if(!muted)playSound([[0,220,.12]]);
});
document.addEventListener('keydown',event=>{
  if($('detail').open||event.altKey||event.ctrlKey||event.metaKey)return;
  if(event.key==='ArrowLeft'||event.key==='ArrowRight'){
    event.preventDefault();flip(event.key==='ArrowRight'?1:-1);
  }
});
render();
</script>
</body>
</html>
