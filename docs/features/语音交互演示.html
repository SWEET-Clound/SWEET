    &lt;div class=&quot;stage&quot; data-step=&quot;6&quot; style=&quot;--stage-color:var(--viz-series-3)&quot;&gt;
      &lt;span class=&quot;stage-kind text-small&quot;&gt;算法处理 · 按需&lt;/span&gt;
      &lt;span class=&quot;stage-title&quot;&gt;微搜查询&lt;/span&gt;
      &lt;span class=&quot;stage-detail text-small&quot;&gt;搜索资料并读取可信正文&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;stage&quot; data-step=&quot;7&quot; style=&quot;--stage-color:var(--viz-series-3)&quot;&gt;
      &lt;span class=&quot;stage-kind text-small&quot;&gt;算法处理&lt;/span&gt;
      &lt;span class=&quot;stage-title&quot;&gt;答案整理&lt;/span&gt;
      &lt;span class=&quot;stage-detail text-small&quot;&gt;VoiceAgent 汇总内容并生成回答&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;stage&quot; data-step=&quot;8&quot; style=&quot;--stage-color:var(--viz-series-3)&quot;&gt;
      &lt;span class=&quot;stage-kind text-small&quot;&gt;算法处理&lt;/span&gt;
      &lt;span class=&quot;stage-title&quot;&gt;TTS 语音合成&lt;/span&gt;
      &lt;span class=&quot;stage-detail text-small&quot;&gt;把文字回答转换为流式语音&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;stage&quot; data-step=&quot;9&quot; style=&quot;--stage-color:var(--viz-series-2)&quot;&gt;
      &lt;span class=&quot;stage-kind text-small&quot;&gt;后端回传&lt;/span&gt;
      &lt;span class=&quot;stage-title&quot;&gt;结果封装与下发&lt;/span&gt;
      &lt;span class=&quot;stage-detail text-small&quot;&gt;校验话轮，发送音频、状态和引用&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;stage&quot; data-step=&quot;10&quot; style=&quot;--stage-color:var(--viz-series-1)&quot;&gt;
      &lt;span class=&quot;stage-kind text-small&quot;&gt;前端输出&lt;/span&gt;
      &lt;span class=&quot;stage-title&quot;&gt;手机播放与展示&lt;/span&gt;
      &lt;span class=&quot;stage-detail text-small&quot;&gt;播放语音、显示状态并等待下一轮&lt;/span&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;future-branch&quot; hidden&gt;
    &lt;span class=&quot;viz-badge&quot;&gt;未来能力从 VoiceAgent 受控扩展&lt;/span&gt;
    &lt;div class=&quot;future-grid&quot;&gt;
      &lt;div class=&quot;future-item&quot;&gt;&lt;strong&gt;更多资料源&lt;/strong&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;知识库、联网检索、结果卡片&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;future-item&quot;&gt;&lt;strong&gt;办公写操作&lt;/strong&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;日程、文档、消息；必须用户确认&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;future-item&quot;&gt;&lt;strong&gt;异步多智能体&lt;/strong&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;对话继续，后台任务完成后择机播报&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;future-item&quot;&gt;&lt;strong&gt;更多终端&lt;/strong&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;Web、桌面客户端与多模态界面&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;experience&quot;&gt;
    &lt;section class=&quot;card conversation&quot; aria-labelledby=&quot;cva-user-view-title&quot;&gt;
      &lt;h3 id=&quot;cva-user-view-title&quot;&gt;用户看到的体验&lt;/h3&gt;
      &lt;div class=&quot;state-line&quot;&gt;
        &lt;span class=&quot;viz-badge&quot; data-role=&quot;state&quot;&gt;等待演示&lt;/span&gt;
        &lt;span class=&quot;viz-badge&quot; data-role=&quot;owner&quot;&gt;负责方：—&lt;/span&gt;
        &lt;span class=&quot;text-small text-muted&quot; data-role=&quot;state-detail&quot;&gt;选择一种场景&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;conversation-line&quot;&gt;&lt;span class=&quot;speaker&quot;&gt;用户&lt;/span&gt;&lt;span data-role=&quot;user-text&quot;&gt;—&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;conversation-line&quot;&gt;&lt;span class=&quot;speaker&quot;&gt;助手&lt;/span&gt;&lt;span data-role=&quot;assistant-text&quot;&gt;—&lt;/span&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section aria-labelledby=&quot;cva-events-title&quot;&gt;
      &lt;h3 id=&quot;cva-events-title&quot;&gt;系统处理记录（最新在上）&lt;/h3&gt;
      &lt;ul class=&quot;event-list text-small&quot; data-role=&quot;event-list&quot; aria-live=&quot;polite&quot;&gt;
        &lt;li&gt;等待开始&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/section&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;cva-leader-flow&#x27;);
      const stages = [...root.querySelectorAll(&#x27;.stage&#x27;)];
      const progress = root.querySelector(&#x27;.progress&#x27;);
      const bar = root.querySelector(&#x27;.progress-bar&#x27;);
      const input = root.querySelector(&#x27;#cva-user-input&#x27;);
      const state = root.querySelector(&#x27;[data-role=&quot;state&quot;]&#x27;);
      const owner = root.querySelector(&#x27;[data-role=&quot;owner&quot;]&#x27;);
      const detail = root.querySelector(&#x27;[data-role=&quot;state-detail&quot;]&#x27;);
      const userText = root.querySelector(&#x27;[data-role=&quot;user-text&quot;]&#x27;);
      const assistantText = root.querySelector(&#x27;[data-role=&quot;assistant-text&quot;]&#x27;);
      const eventList = root.querySelector(&#x27;[data-role=&quot;event-list&quot;]&#x27;);
      const future = root.querySelector(&#x27;.future-branch&#x27;);
      const buttons = [...root.querySelectorAll(&#x27;[data-scenario]&#x27;)];
      const previousButton = root.querySelector(&#x27;[data-action=&quot;previous&quot;]&#x27;);
      const nextButton = root.querySelector(&#x27;[data-action=&quot;next&quot;]&#x27;);
      const stepPosition = root.querySelector(&#x27;[data-role=&quot;step-position&quot;]&#x27;);
      const phaseLabels = [...root.querySelectorAll(&#x27;[data-phase]&#x27;)];

      const moduleOwners = [&#x27;手机前端&#x27;, &#x27;业务后端&#x27;, &#x27;实时语音后端&#x27;, &#x27;算法服务&#x27;, &#x27;算法服务&#x27;, &#x27;算法服务&#x27;, &#x27;算法服务&#x27;, &#x27;算法服务&#x27;, &#x27;算法服务&#x27;, &#x27;实时语音后端&#x27;, &#x27;手机前端&#x27;];
      const modulePhases = [&#x27;front-in&#x27;, &#x27;backend-in&#x27;, &#x27;backend-in&#x27;, &#x27;algorithm&#x27;, &#x27;algorithm&#x27;, &#x27;algorithm&#x27;, &#x27;algorithm&#x27;, &#x27;algorithm&#x27;, &#x27;algorithm&#x27;, &#x27;backend-out&#x27;, &#x27;front-out&#x27;];

      const sequences = {
        normal: [
          { node:0, state:&#x27;正在录音&#x27;, detail:&#x27;手机采集用户声音&#x27;, event:&#x27;前端完成录音与基础降噪&#x27; },
          { node:1, state:&#x27;校验身份&#x27;, detail:&#x27;后端确认用户和会话合法&#x27;, event:&#x27;业务后端创建可信会话与短期凭证&#x27; },
          { node:2, state:&#x27;音频上行&#x27;, detail:&#x27;后端接收实时音频&#x27;, event:&#x27;实时语音网关建立话轮并转交算法&#x27; },
          { node:3, state:&#x27;检测说话&#x27;, detail:&#x27;判断用户是否已经说完&#x27;, event:&#x27;VAD 确认本轮语音结束&#x27; },
          { node:4, state:&#x27;正在识别&#x27;, detail:&#x27;把语音转换成文字&#x27;, event:&#x27;ASR 输出本轮最终文本&#x27; },
          { node:5, state:&#x27;理解问题&#x27;, detail:&#x27;VoiceAgent 判断可以直接回答&#x27;, event:&#x27;本轮不需要调用微搜&#x27;, skipTool:true },
          { node:7, state:&#x27;生成答案&#x27;, detail:&#x27;整理为自然、简洁的口语回答&#x27;, event:&#x27;VoiceAgent 输出可播报的回答文本&#x27;, skipTool:true },
          { node:8, state:&#x27;合成语音&#x27;, detail:&#x27;回答文字转换为音频流&#x27;, event:&#x27;TTS 生成首段语音&#x27;, answer:&#x27;我已经理解你的问题，正在用语音回答。&#x27;, skipTool:true },
          { node:9, state:&#x27;后端回传&#x27;, detail:&#x27;校验话轮并封装返回数据&#x27;, event:&#x27;后端下发音频、状态和结束事件&#x27;, skipTool:true },
          { node:10, state:&#x27;回答完成&#x27;, detail:&#x27;手机播放并恢复聆听&#x27;, event:&#x27;前端播放完成，等待下一轮对话&#x27;, skipTool:true }
        ],
        tool: [
          { node:0, state:&#x27;正在录音&#x27;, detail:&#x27;用户提出资料查询&#x27;, event:&#x27;前端采集语音并准备上传&#x27; },
          { node:1, state:&#x27;校验身份&#x27;, detail:&#x27;后端确认用户与访问权限&#x27;, event:&#x27;业务后端创建可信会话与短期凭证&#x27; },
          { node:2, state:&#x27;音频上行&#x27;, detail:&#x27;后端接收实时音频&#x27;, event:&#x27;实时语音网关建立话轮并转交算法&#x27; },
          { node:3, state:&#x27;检测说话&#x27;, detail:&#x27;判断查询问题是否说完&#x27;, event:&#x27;VAD 确认语音结束并锁定本轮输入&#x27; },
          { node:4, state:&#x27;正在识别&#x27;, detail:&#x27;把查询语音转换成文字&#x27;, event:&#x27;ASR 输出完整查询文本&#x27; },
          { node:5, state:&#x27;理解任务&#x27;, detail:&#x27;VoiceAgent 判断需要查询资料&#x27;, event:&#x27;VoiceAgent 选择只读微搜能力&#x27; },
          { node:6, state:&#x27;正在查询&#x27;, detail:&#x27;微搜检索并读取可信正文&#x27;, event:&#x27;微搜把资料结果返回 VoiceAgent&#x27; },
          { node:7, state:&#x27;整理答案&#x27;, detail:&#x27;汇总资料并形成可解释结论&#x27;, event:&#x27;VoiceAgent 生成带来源的口语回答&#x27; },
          { node:8, state:&#x27;合成语音&#x27;, detail:&#x27;答案文字转换成音频流&#x27;, event:&#x27;TTS 生成首段语音&#x27;, answer:&#x27;已完成资料查询，我正在为你概括重点内容。&#x27; },
          { node:9, state:&#x27;后端回传&#x27;, detail:&#x27;校验话轮并封装结果&#x27;, event:&#x27;后端通过 WebRTC 和 DataChannel 下发音频、状态与引用&#x27; },
          { node:10, state:&#x27;回答完成&#x27;, detail:&#x27;手机播放语音并显示查询状态&#x27;, event:&#x27;前端完成播放，继续等待下一轮对话&#x27; }
        ],
        interrupt: [
          { node:10, state:&#x27;正在播报&#x27;, detail:&#x27;手机正在播放第一轮回答&#x27;, event:&#x27;用户听到第一轮语音回答&#x27;, answer:&#x27;这是第一轮回答，用户可以随时打断我……&#x27; },
          { node:0, state:&#x27;用户打断&#x27;, detail:&#x27;手机检测到用户再次开口&#x27;, event:&#x27;前端立即停止本地播放并上传新语音&#x27;, interrupted:true },
          { node:2, state:&#x27;建立新话轮&#x27;, detail:&#x27;后端接收打断信号和新音频&#x27;, event:&#x27;实时后端生成新的 turn_id，使旧话轮失效&#x27; },
          { node:5, state:&#x27;取消旧任务&#x27;, detail:&#x27;VoiceAgent 停止旧回答&#x27;, event:&#x27;算法终止旧 Agent 生成任务&#x27; },
          { node:8, state:&#x27;停止旧音频&#x27;, detail:&#x27;TTS 停止旧语音合成&#x27;, event:&#x27;算法丢弃尚未下发的旧音频&#x27; },
          { node:3, state:&#x27;检测新语音&#x27;, detail:&#x27;VAD 判断新问题是否说完&#x27;, event:&#x27;新话轮语音边界确认&#x27; },
          { node:4, state:&#x27;识别新问题&#x27;, detail:&#x27;ASR 转写用户的新要求&#x27;, event:&#x27;ASR 输出新话轮文本&#x27; },
          { node:5, state:&#x27;处理新问题&#x27;, detail:&#x27;VoiceAgent 只处理当前有效话轮&#x27;, event:&#x27;迟到的旧文本和工具结果被丢弃&#x27; },
          { node:7, state:&#x27;生成新答案&#x27;, detail:&#x27;形成针对新问题的回答&#x27;, event:&#x27;VoiceAgent 输出新话轮答案文本&#x27; },
          { node:8, state:&#x27;合成新语音&#x27;, detail:&#x27;只合成新话轮回答&#x27;, event:&#x27;TTS 生成新的音频流&#x27;, answer:&#x27;好的，旧回答已经停止。现在回答你的新问题。&#x27; },
          { node:9, state:&#x27;后端回传&#x27;, detail:&#x27;后端只允许新话轮结果下发&#x27;, event:&#x27;后端过滤所有迟到的旧文本和旧音频&#x27; },
          { node:10, state:&#x27;恢复播放&#x27;, detail:&#x27;手机只播放新回答&#x27;, event:&#x27;前端继续新话轮并恢复聆听&#x27; }
        ],
        future: [
          { node:5, state:&#x27;能力入口&#x27;, detail:&#x27;扩展能力仍由 VoiceAgent 统一判断&#x27;, event:&#x27;避免手机端直接调用不受控工具&#x27; },
          { node:6, state:&#x27;更多资料源&#x27;, detail:&#x27;增加知识库和联网检索&#x27;, event:&#x27;新资料源仍作为算法侧受控能力接入&#x27; },
          { node:7, state:&#x27;异步多智能体&#x27;, detail:&#x27;子任务后台执行，主对话继续&#x27;, event:&#x27;子智能体结果回到 VoiceAgent 汇总&#x27; },
          { node:9, state:&#x27;安全回传&#x27;, detail:&#x27;写操作结果必须确认、审计和补偿&#x27;, event:&#x27;后端统一控制结果返回和风险提示&#x27; },
          { node:10, state:&#x27;更多终端&#x27;, detail:&#x27;扩展 Web、桌面和多模态展示&#x27;, event:&#x27;不同终端复用相同后端和算法闭环&#x27; }
        ]
      };

      const setActive = (node, index, skipTool) =&gt; {
        stages.forEach((stage, stageIndex) =&gt; {
          const isActive = node === stageIndex;
          stage.classList.toggle(&#x27;is-active&#x27;, isActive);
          stage.classList.toggle(&#x27;is-past&#x27;, stageIndex &lt; node);
          stage.classList.toggle(&#x27;is-skipped&#x27;, skipTool &amp;&amp; stageIndex === 6);
          if (isActive) stage.setAttribute(&#x27;aria-current&#x27;, &#x27;step&#x27;);
          else stage.removeAttribute(&#x27;aria-current&#x27;);
        });
        phaseLabels.forEach(label =&gt; {
          const isActive = label.dataset.phase === modulePhases[node];
          label.classList.toggle(&#x27;is-active&#x27;, isActive);
          if (isActive) label.setAttribute(&#x27;aria-current&#x27;, &#x27;step&#x27;);
          else label.removeAttribute(&#x27;aria-current&#x27;);
        });
        const pct = Math.round(((index + 1) / currentSequence.length) * 100);
        bar.style.width = pct + &#x27;%&#x27;;
        progress.setAttribute(&#x27;aria-valuenow&#x27;, String(pct));
      };

      let currentSequence = [];
      let currentIndex = -1;
      const renderCurrentStep = () =&gt; {
        const item = currentSequence[currentIndex];
        if (!item) return;
        setActive(item.node, currentIndex, item.skipTool);
        state.textContent = item.state;
        owner.textContent = `负责方：${moduleOwners[item.node]}`;
        detail.textContent = item.detail;
        assistantText.textContent = &#x27;处理中…&#x27;;
        currentSequence.slice(0, currentIndex + 1).forEach(step =&gt; {
          if (step.answer) assistantText.textContent = step.answer;
          if (step.interrupted) assistantText.textContent = &#x27;（旧回答已停止，不会恢复播放）&#x27;;
        });
        eventList.innerHTML = &#x27;&#x27;;
        currentSequence.slice(Math.max(0, currentIndex - 3), currentIndex + 1).reverse().forEach(step =&gt; {
          const li = document.createElement(&#x27;li&#x27;);
          li.textContent = step.event;
          eventList.appendChild(li);
        });
        const moduleName = stages[item.node].querySelector(&#x27;.stage-title&#x27;).textContent;
        stepPosition.textContent = `第 ${currentIndex + 1} / ${currentSequence.length} 步 · ${moduleName}`;
        previousButton.disabled = currentIndex === 0;
        nextButton.disabled = currentIndex === currentSequence.length - 1;
      };

      const saveState = (scenario) =&gt; {
        if (!window.openai || !window.openai.setWidgetState) return;
        window.openai.setWidgetState({
          modelContent: { scenario, userInput: input.value },
          privateContent: { scenario, userInput: input.value }
        }).catch(() =&gt; {});
      };

      const run = (scenario) =&gt; {
        currentSequence = sequences[scenario];
        currentIndex = 0;
        root.classList.add(&#x27;has-active&#x27;);
        future.hidden = scenario !== &#x27;future&#x27;;
        buttons.forEach(button =&gt; {
          const pressed = button.dataset.scenario === scenario;
          button.setAttribute(&#x27;aria-pressed&#x27;, String(pressed));
        });
        stages.forEach(stage =&gt; stage.classList.remove(&#x27;is-active&#x27;, &#x27;is-past&#x27;, &#x27;is-skipped&#x27;));
        bar.style.width = &#x27;0%&#x27;;
        progress.setAttribute(&#x27;aria-valuenow&#x27;, &#x27;0&#x27;);
        eventList.innerHTML = &#x27;&#x27;;
        userText.textContent = input.value.trim() || &#x27;（未输入内容）&#x27;;
        assistantText.textContent = &#x27;处理中…&#x27;;
        renderCurrentStep();
        saveState(scenario);
      };

      buttons.forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; run(button.dataset.scenario)));
      previousButton.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (currentIndex &lt;= 0) return;
        currentIndex -= 1;
        renderCurrentStep();
      });
      nextButton.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (currentIndex &lt; 0 || currentIndex &gt;= currentSequence.length - 1) return;
        currentIndex += 1;
        renderCurrentStep();
      });
      const saved = window.openai &amp;&amp; window.openai.widgetState &amp;&amp; window.openai.widgetState.privateContent;
      if (saved &amp;&amp; typeof saved.userInput === &#x27;string&#x27;) input.value = saved.userInput;
      window.addEventListener(&#x27;openai:set_globals&#x27;, event =&gt; {
        const next = event.detail &amp;&amp; event.detail.globals &amp;&amp; event.detail.globals.widgetState;
        if (next &amp;&amp; next.privateContent &amp;&amp; typeof next.privateContent.userInput === &#x27;string&#x27;) {
          input.value = next.privateContent.userInput;
        }
      });
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (event) =&gt; {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest(&quot;[data-tooltip]&quot;);
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =&gt;

            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
