[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "persistent-memory"
version = "0.1.0"
description = "A standalone, policy-gated persistent memory service for AI products."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.20.1",
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "prometheus-client==0.26.0",
  "psycopg[binary,pool]==3.3.6",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.2",
  "PyJWT[crypto]==2.15.1",
  "sqlalchemy[asyncio]==2.1.6",
  "structlog==25.5.0",
  "uvicorn[standard]==0.54.0",
]

[project.scripts]
memory-api = "memory_system.api:main"
memory-worker = "memory_system.worker:main"
memory-dev-token = "memory_system.dev:token_main"
memory-smoke = "memory_system.dev:smoke_main"

[project.optional-dependencies]
test = [
  "pytest==8.4.2",
  "pytest-asyncio==0.26.0",
  "ruff==0.17.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/memory_system"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "postgres: requires MEMORY_TEST_DATABASE_URL pointing to a disposable *_test database",
]

