confidence_gates:
  gate_0:
    due: "week_8_to_12"
    confidence_after_pass: "65-70%"
    requires:
      - two_backend_reproducible_result
      - repeated_measurements
      - profiler_supported_bottleneck
      - continued_interest
  gate_1:
    due: "month_3_to_4"
    confidence_after_pass: "70-78%"
    requires:
      - correctness_latency_cost_benchmark
      - reproducible_regression
      - nontrivial_upstream_feedback
  gate_2:
    due: "month_6_to_8"
    confidence_after_pass: "78-85%"
    requires:
      - at_least_15_percent_tail_latency_or_cost_improvement
      - no_quality_or_correctness_regression
      - second_engine_or_hardware_explanation
  gate_3:
    due: "month_9_to_12"
    confidence_after_pass: "85-90%"
    requires_any:
      - external_team_adoption
      - two_substantive_merged_pull_requests
      - paid_pilot_internship_or_collaboration
  gate_4:
    due: "month_12_to_18"
    requires:
      - hard_to_copy_workload_trace_eval_or_hardware_experience
      - real_incident_or_capacity_problem
      - transfer_to_new_model_hardware_or_engine
stop_rules:
  - tutorial_only_after_eight_weeks
  - no_credible_benchmark_after_four_months
  - no_technical_feedback_or_users_after_six_months
  - target_optimization_commoditized_within_ten_percent
  - project_declines_for_two_consecutive_quarters
