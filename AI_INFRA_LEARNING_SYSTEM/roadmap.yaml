  - id: phase_4
    name: realtime_multimodal_product
    months: "9-12"
    exit_evidence:
      - fifty_real_sessions
      - five_real_testers
      - latency_and_task_metrics
  - id: phase_5
    name: production_reliability
    months: "13-15"
    exit_evidence:
      - seven_day_run
      - ten_fault_classes
      - regression_gate
  - id: phase_6
    name: specialization
