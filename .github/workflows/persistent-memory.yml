name: Persistent memory

on:
  push:
    paths:
      - 'persistent-memory/**'
      - '.github/workflows/persistent-memory.yml'
  pull_request:
    paths:
      - 'persistent-memory/**'
      - '.github/workflows/persistent-memory.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: persistent-memory
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: memory
          POSTGRES_PASSWORD: ci-owner-password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d memory"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MEMORY_TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-owner-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/memory_test
      MEMORY_TEST_APP_DATABASE_URL: postgresql+psycopg://memory_app:memory-app-local@127.0.0.1:${{ job.services.postgres.ports[5432] }}/memory_test
      MEMORY_TEST_WORKER_DATABASE_URL: postgresql+psycopg://memory_worker:memory-worker-local@127.0.0.1:${{ job.services.postgres.ports[5432] }}/memory_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Initialize disposable database and roles
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d memory < deploy/postgres/init.sql
          docker exec "$POSTGRES_CONTAINER" createdb -U postgres memory_test
      - run: python -m pip install '.[test]'
      - name: Apply packaged migrations
        run: MEMORY_DATABASE_URL="$MEMORY_TEST_DATABASE_URL" memory-migrate
      - run: ruff check src migrations tests
      - run: memory-eval
      - run: pytest -q
